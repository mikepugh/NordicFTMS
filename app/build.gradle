plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

def runCommand(List<String> command) {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            workingDir rootDir
            commandLine command
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return ""
    }
}

def parseVersionInfo(String rawVersion) {
    if (!rawVersion) {
        return null
    }

    def matcher = (rawVersion.trim().replaceFirst(/^v/, "") =~ /^(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g([0-9a-f]+))?(-dirty)?$/)
    if (!matcher.matches()) {
        return null
    }

    return [
            major          : matcher[0][1].toInteger(),
            minor          : matcher[0][2].toInteger(),
            patch          : matcher[0][3].toInteger(),
            commitsSinceTag: matcher[0][4] ? matcher[0][4].toInteger() : 0,
            gitSha         : matcher[0][5] ?: "",
            dirty          : matcher[0][6] != null,
            fallback       : false
    ]
}

def resolveVersionInfo() {
    def explicitVersion = (project.findProperty("VERSION_NAME") ?: System.getenv("VERSION_NAME"))?.toString()?.trim()
    if (explicitVersion) {
        def parsedExplicitVersion = parseVersionInfo(explicitVersion)
        if (parsedExplicitVersion == null) {
            throw new GradleException("VERSION_NAME '${explicitVersion}' must use MAJOR.MINOR.PATCH format")
        }
        return parsedExplicitVersion
    }

    def githubRefName = System.getenv("GITHUB_REF_NAME")?.trim()
    def parsedGithubRef = parseVersionInfo(githubRefName)
    if (parsedGithubRef != null) {
        return parsedGithubRef
    }

    def gitDescribe = runCommand(["git", "describe", "--tags", "--long", "--dirty", "--match", "v[0-9]*"])
    def parsedGitDescribe = parseVersionInfo(gitDescribe)
    if (parsedGitDescribe != null) {
        return parsedGitDescribe
    }

    return [
            major          : 0,
            minor          : 0,
            patch          : 0,
            commitsSinceTag: 0,
            gitSha         : "",
            dirty          : false,
            fallback       : true
    ]
}

def buildVersionName(Map<String, ?> versionInfo) {
    if (versionInfo.fallback) {
        return "0.0.0-local"
    }

    def baseVersion = "${versionInfo.major}.${versionInfo.minor}.${versionInfo.patch}"
    if (versionInfo.commitsSinceTag == 0 && !versionInfo.dirty) {
        return baseVersion
    }

    def suffixParts = []
    if (versionInfo.commitsSinceTag > 0) {
        suffixParts << "dev.${versionInfo.commitsSinceTag}"
    }
    if (versionInfo.gitSha) {
        suffixParts << versionInfo.gitSha
    }
    if (versionInfo.dirty) {
        suffixParts << "dirty"
    }

    return "${baseVersion}-${suffixParts.join('.')}"
}

def buildVersionCode(Map<String, ?> versionInfo) {
    if (versionInfo.fallback) {
        return 1
    }

    if (versionInfo.major > 99 || versionInfo.minor > 99 || versionInfo.patch > 99 || versionInfo.commitsSinceTag > 99) {
        throw new GradleException("Version components must stay within two digits to generate a valid versionCode")
    }

    return (versionInfo.major * 1000000) + (versionInfo.minor * 10000) + (versionInfo.patch * 100) + versionInfo.commitsSinceTag
}

def resolvedVersionInfo = resolveVersionInfo()
def resolvedVersionName = buildVersionName(resolvedVersionInfo)
def resolvedVersionCode = buildVersionCode(resolvedVersionInfo)

logger.lifecycle("NordicFTMS build version: ${resolvedVersionName} (${resolvedVersionCode})")

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.nordicftms.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
                sentryDsn: (project.findProperty("SENTRY_DSN")
                        ?: System.getenv("SENTRY_DSN")
                        ?: "")
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.60.1'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
            task.plugins {
                grpc {
                    option "lite"
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'io.sentry:sentry-android-core:8.34.1'

    // jmDNS for DIRCON mDNS/Bonjour service advertisement
    implementation 'org.jmdns:jmdns:3.5.9'

    // gRPC for GlassOS communication
    implementation 'io.grpc:grpc-okhttp:1.60.1'
    implementation 'io.grpc:grpc-protobuf-lite:1.60.1'
    implementation 'io.grpc:grpc-stub:1.60.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
